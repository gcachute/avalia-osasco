name: Publicar na Cloudflare

# Gera o site e publica na Cloudflare Pages (projeto "deolhoemoz").
# Push na main: produção (deolhoemoz.com.br). Push em outro branch: prévia em <branch>.deolhoemoz.pages.dev.
# Precisa dos secrets CLOUDFLARE_API_TOKEN (permissão "Cloudflare Pages: Edit") e CLOUDFLARE_ACCOUNT_ID; GH_ISSUES_TOKEN liga o formulário de correção.
# A pasta functions/ (formulário de correção) vai junto: o wrangler a publica como Pages Functions.
on:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJETO: deolhoemoz
  DOMINIOS: deolhoemoz.com.br www.deolhoemoz.com.br

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chamado pela atualização mensal: publica a main já com os dados novos.
          ref: ${{ github.event_name == 'workflow_call' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Criar o projeto na primeira vez
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project list | grep -qw "$PROJETO" || npx --yes wrangler@4 pages project create "$PROJETO" --production-branch main

      # Token do GitHub que o formulário de correção usa para abrir issues (functions/api/correcao.js).
      # Fica guardado na Cloudflare como segredo, em produção e nas prévias. Sem o secret GH_ISSUES_TOKEN, o passo não faz nada.
      - name: Token do formulário de correção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
        run: |
          if [ -z "$GH_ISSUES_TOKEN" ]; then echo "Sem GH_ISSUES_TOKEN: o formulário fica sem envio automático."; exit 0; fi
          jq -n --arg t "$GH_ISSUES_TOKEN" '{deployment_configs: {production: {env_vars: {GITHUB_TOKEN: {type: "secret_text", value: $t}}}, preview: {env_vars: {GITHUB_TOKEN: {type: "secret_text", value: $t}}}}}'             | curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJETO"                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data @-             | jq -c '{success, erros: [.errors[]?.message]}'

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name "$PROJETO" --branch "${{ github.event_name == 'workflow_call' && 'main' || github.ref_name }}" --commit-dirty=true

      # Liga os domínios ao projeto (a Cloudflare cria o DNS e o certificado). Se já estiverem ligados, a API só recusa.
      - name: Domínios
        if: github.ref_name == 'main' || github.event_name == 'workflow_call'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for d in $DOMINIOS; do
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJETO/domains"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"               --data "{\"name\":\"$d\"}" | jq -c --arg d "$d" '{dominio: $d, success, erros: [.errors[]?.message]}'
          done

      # Estado de cada domínio no projeto (ativo, pendente, erro de verificação).
      - name: Estado dos domínios
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJETO/domains"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             | jq -c '.errors[]?.message, (.result[]? | {name, status, verificacao: .verification_data, validacao: .validation_data})'
